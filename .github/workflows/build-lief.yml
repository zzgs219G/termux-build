name: build lief for android arm64

# 目标：产出可在 Termux (aarch64 / Python 3.14) 里 import 的 lief 扩展模块
#
# 为什么需要 CI：
#   lief 官方不发布 Android wheel，pip 会主动拒绝（backend/setup.py:144
#   打 "LIEF does not provide precompiled wheels for 'android - aarch64'"）。
#   本机交叉编译需要 cmake + ninja + 数 GB 内存，手机上不现实。
#
# 为什么不用 pip 的 sdist：
#   PyPI 上的 lief sdist 是【mock 包】（7.8KB），只留 backend/ 用于平台检查，
#   src/ 和 build-requirements.txt 都被剔除 → 无法从 sdist 构建。
#   必须用 git 源码。
#
# 关键难点：nanobind 需要【目标平台】的 Python 开发文件
#   find_package(Python COMPONENTS Development.Module) 会去找 Python.h 和
#   pyconfig.h。runner 上装的是 x86_64 Linux 的 Python，那个 pyconfig.h
#   描述的是 glibc/x86_64，直接拿来交叉编译会得到错误的类型宽度
#   （SIZEOF_LONG 等），产物一 import 就崩。
#   解法：用 Termux 的 aarch64 pyconfig.h —— 由 python-headers.tar.gz 传入。

on:
  workflow_dispatch:
    inputs:
      lief_ref:
        description: 'LIEF 的 git ref（tag 或 commit）'
        required: false
        default: '0.17.6'
      python_version:
        description: '目标 Python 版本（须与 Termux 一致，决定 ABI tag）'
        required: false
        default: '3.14'
      android_api:
        description: 'ANDROID_PLATFORM（最低 API）'
        required: false
        default: '24'
      ndk_version:
        description: 'NDK 版本'
        required: false
        default: '29.0.0'
  # ⚠️ 刻意【不】监听 push.tags：
  #   tag 的语义是"给某个已存在的产物打标记"，不是"重新做一遍"。
  #   2026-11-14 首次打 v2 时踩过这点 —— 推 tag 触发了一轮完整构建，
  #   而产物早就编好并真机验证过了，等于白跑一次（虽然 ccache 命中
  #   只要 30 秒，但语义是错的）。
  #   发布流程：workflow_dispatch 构建 → 下载 artifact →
  #   在 Releases 页面挂到对应 tag。tag 本身不触发编译。

permissions:
  # 只需要读：本 workflow 不创建 Release、不改仓库内容，
  # 只在 Actions 里产出 artifact。发布是人工在 Releases 页面挂的。
  contents: read

env:
  PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.14' }}
  ANDROID_API: ${{ github.event.inputs.android_api || '24' }}
  NDK_VERSION: ${{ github.event.inputs.ndk_version || '29.0.0' }}
  LIEF_REF: ${{ github.event.inputs.lief_ref || '0.17.6' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout（本仓库，只取 workflow 与脚本）
        uses: actions/checkout@v4

      - name: 环境自检
        run: |
          set -euo pipefail
          echo "== 磁盘（LIEF 编译需要数 GB）=="
          df -h /
          echo
          echo "== CPU / 内存 =="
          nproc
          free -m
          echo
          echo "== 目标 =="
          echo "  Python : $PYTHON_VERSION"
          echo "  API    : android-$ANDROID_API"
          echo "  NDK    : $NDK_VERSION"
          echo "  LIEF   : $LIEF_REF"

      - name: 安装构建工具
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # cmake 要 >= 3.24（lief 的 pyproject 要求），ubuntu-latest 自带够
          # ninja 比 make 快得多，且 LIEF 官方 CI 就用它
          sudo apt-get install -y -qq ninja-build cmake zip unzip curl file

      - name: 安装 NDK
        run: |
          set -euo pipefail
          # 不用 sdkmanager：它只认完整版本号，且体积更大
          ZIP="android-ndk-r${NDK_VERSION}-linux.zip"
          # NDK 29 的命名是 r29（不带小版本），29.0.0 → r29
          ZIP="android-ndk-r${NDK_VERSION%%.*}-linux.zip"
          URL="https://dl.google.com/android/repository/${ZIP}"
          echo "下载 $URL"
          curl -fsSL -o /tmp/ndk.zip "$URL"
          ls -lh /tmp/ndk.zip
          mkdir -p "$RUNNER_TEMP/ndk"
          unzip -q /tmp/ndk.zip -d "$RUNNER_TEMP/ndk"
          NDK_DIR=$(find "$RUNNER_TEMP/ndk" -maxdepth 1 -type d -name 'android-ndk-*' | head -1)
          test -d "$NDK_DIR" || { echo "✗ NDK 解压失败"; ls "$RUNNER_TEMP/ndk"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK 就位: $NDK_DIR"
          ls "$NDK_DIR/build/cmake/android.toolchain.cmake"

      # ── 关键步骤：目标平台的 Python 开发文件 ────────────────────────
      # 从 Termux 打包上传的 python-headers.tar.gz 解出。
      # 里面必须有：
      #   include/pythonX.Y/Python.h
      #   include/pythonX.Y/pyconfig.h      ← aarch64 Android 版本，最关键
      #   include/pythonX.Y/...             （其余头文件）
      - name: 取出目标平台 Python 头文件
        run: |
          set -euo pipefail
          # 来源：仓库内 lief/vendor/python-headers-<ver>.tar.gz
          # 由 Termux 侧 lief/pack-python-headers.sh 生成后提交（408KB，无外部依赖）
          ART="lief/vendor/python-headers-${PYTHON_VERSION}.tar.gz"
          if [ ! -f "$ART" ]; then
            echo "✗ 缺少 $ART"
            echo
            echo "这个文件必须来自 Termux（不是 runner 上的 Python）："
            echo "  交叉编译需要【目标平台】的 pyconfig.h。runner 的 x86_64"
            echo "  pyconfig.h 里 SIZEOF_LONG / HAVE_FORK 等是按 x86_64 生成的，"
            echo "  用它编出的扩展模块结构体布局错误，真机 import 即崩。"
            echo
            echo "在 Termux 里生成："
            echo "  ./lief/pack-python-headers.sh ${PYTHON_VERSION}"
            echo "  cp lief/dist/python-headers-${PYTHON_VERSION}.tar.gz lief/vendor/"
            echo "  git add lief/vendor/ && git commit -m 'chore: 更新 Python 头文件'"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/pyinc"
          tar xzf "$ART" -C "$RUNNER_TEMP/pyinc"
          PYINC=$(find "$RUNNER_TEMP/pyinc" -maxdepth 2 -name pyconfig.h | head -1)
          test -n "$PYINC" || { echo "✗ 包里找不到 pyconfig.h"; find "$RUNNER_TEMP/pyinc" -maxdepth 3 | head -20; exit 1; }
          PYINC=$(dirname "$PYINC")

          echo "Python include: $PYINC"
          echo "== 校验这份头文件确实是 aarch64 Android 的 =="
          grep -E "^#define (SIZEOF_LONG|SIZEOF_VOID_P) " "$PYINC/pyconfig.h" | sed 's/^/  /'
          # 硬校验：两处都必须是 8（64 位）。若不成立说明包拿错了，
          # 编出来的模块必然崩，不如现在就失败。
          for k in SIZEOF_LONG SIZEOF_VOID_P; do
            v=$(grep -E "^#define $k " "$PYINC/pyconfig.h" | awk '{print $3}')
            [ "$v" = "8" ] || { echo "✗ $k=$v，不是 64 位目标头文件" >&2; exit 1; }
          done
          echo "  ✓ 64 位目标头文件校验通过"
          echo "PYINC=$PYINC" >> "$GITHUB_ENV"

      - name: 拉取 LIEF 源码
        run: |
          set -euo pipefail
          # --recursive 必须：third-party/ 下是 submodule
          git clone --depth=1 --branch "$LIEF_REF" \
            --recurse-submodules --shallow-submodules \
            https://github.com/lief-project/LIEF lief-src \
            || {
              # tag 可能不是分支，退一步用全量 + checkout
              git clone --recurse-submodules https://github.com/lief-project/LIEF lief-src
              git -C lief-src checkout "$LIEF_REF"
              git -C lief-src submodule update --init --recursive --depth=1
            }
          # 确认不是 mock sdist：必须有 src/ 和 build-requirements.txt
          test -d lief-src/src || { echo "✗ 缺 src/，这不是完整源码"; exit 1; }
          test -f lief-src/api/python/build-requirements.txt \
            || { echo "✗ 缺 build-requirements.txt，这是 mock sdist"; exit 1; }
          echo "LIEF 源码就位: $(git -C lief-src rev-parse --short HEAD)"

      # ── 只做一次编译：顶层配置 + 开 Python 绑定 ─────────────────────
      # 为什么删掉了原来那个"先编 C++ 核心"的步骤（2026-11-14）：
      #   它编 452 个目标、约 90 秒，但【完全浪费】——
      #   下一步 build-py 从顶层配置时会把 LIEF 核心重新编一遍
      #   （实测 849 个目标里绝大部分是核心源码），两者不共享
      #   CMakeCache，无法复用。留着只是让每轮 CI 多等 1.5 分钟。
      #   它的产物（libLIEF*.a）也不进最终产物，纯属诊断用。
      #
      #   当时拆两步的理由是"失败时分不清是 LIEF 编不过还是绑定配不上"。
      #   但实际排查下来，报错信息本身就能区分（CMake Error 会指出
      #   是哪一行、哪个 target），不需要多花一次完整编译来隔离。
      - name: 安装 ccache 并做缓存
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ccache
          ccache --version | head -1
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> $GITHUB_ENV

      - name: 恢复 ccache（跨轮复用编译产物）
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          # key 里带 LIEF_REF / API / Python 版本：任一变化都必须重新编译，
          # 否则会拿到不匹配的 .o。restore-keys 不加前缀匹配 —— 宁可 miss
          # 也不要错配（LIEF 的 .o 与版本强绑定）。
          key: ccache-lief-${{ env.LIEF_REF }}-api${{ env.ANDROID_API }}-py${{ env.PYTHON_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ccache-lief-${{ env.LIEF_REF }}-api${{ env.ANDROID_API }}-py${{ env.PYTHON_VERSION }}-

      - name: 预置 nanobind（避免 FetchContent 与 find_package 的路径歧义）
        run: |
          set -euo pipefail
          # 为什么要手工解压：
          #   api/python/CMakeLists.txt:30-36 先 FetchContent_Declare(nanobind
          #   URL ${THIRD_PARTY_DIRECTORY}/nanobind-<ver>.zip) 再
          #   FetchContent_MakeAvailable，随后调用
          #       find_package(nanobind REQUIRED PATHS ${nanobind_SOURCE_DIR}/cmake
          #                    NO_DEFAULT_PATH)
          #   在 CMake 4.4 + CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON 下实测
          #   （run 43595571998）：FetchContent 没有产出 nanobind_SOURCE_DIR，
          #   于是 PATHS 为空 → 报
          #       Could not find a package configuration file provided by "nanobind"
          #
          #   不去猜 FetchContent 的变量作用域行为（不同 CMake 版本有差异），
          #   直接把 zip 解开放到确定位置，用 -Dnanobind_DIR 显式指定。
          #   zip 就在 LIEF 源码的 third-party/ 里，不联网。
          NB_ZIP=$(ls lief-src/third-party/nanobind-*.zip | head -1)
          echo "nanobind 包: $NB_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/nanobind-src"
          unzip -q "$NB_ZIP" -d "$GITHUB_WORKSPACE/nanobind-src"
          NB_CMAKEDIR="$GITHUB_WORKSPACE/nanobind-src/cmake"
          test -f "$NB_CMAKEDIR/nanobind-config.cmake" \
            || { echo "✗ 解压后找不到 nanobind-config.cmake"; find "$GITHUB_WORKSPACE/nanobind-src" -name "*.cmake" | head; exit 1; }
          echo "NB_DIR=$NB_CMAKEDIR" >> "$GITHUB_ENV"
          echo "nanobind 就位: $NB_CMAKEDIR"

      - name: 编译 Python 绑定
        run: |
          set -euo pipefail
          cd lief-src
          # ⚠️ 必须从【顶层】配置，不能 -S api/python：
          #   api/python/CMakeLists.txt:22 用的是
          #       ${THIRD_PARTY_DIRECTORY}/nanobind-<ver>.zip
          #   而这个变量只在顶层 CMakeLists.txt:76 定义：
          #       set(THIRD_PARTY_DIRECTORY "${CMAKE_CURRENT_SOURCE_DIR}/third-party/")
          #   从子目录配置时该变量为空 → 路径拼成
          #       /nanobind-2.8.0.r19.g617d5a0.zip   （根目录下的文件）
          #   实测报：File not found: /nanobind-2.8.0.r19.g617d5a0.zip
          #   （run 43593304603 第 10 步）
          #
          #   nanobind 的 zip 在 third-party/ 里是【自带】的，
          #   所以从顶层配置不会触发联网下载，也不需要 submodule。
          #
          # ⚠️ find_package(Python) 必须指向目标平台头文件：
          #   给 Python_INCLUDE_DIR 指到 Termux 的 pyconfig.h 所在目录，
          #   同时禁掉所有让 CMake 去找 runner 上 x86_64 Python 的路子
          #   （Python_ROOT_DIR 指到不存在的位置 + LOCATION 策略）。
          # ⚠️ 关于 CMAKE_FIND_PACKAGE_PREFER_CONFIG：
          #   find_package(Python) 默认走 Module 模式（CMake 自带
          #   FindPython.cmake），此时 Python_DIR 完全被忽略 —— 实测
          #   不设这个开关时，它照样找到 runner/Termux 自带的 libpython，
          #   我们的 PythonConfig.cmake 根本没被执行。
          #   但它会影响【所有】find_package，LIEF 还要找 nlohmann_json /
          #   frozen 等，全局打开可能打乱它们的查找顺序。
          #   折中：只在配置这一步打开（构建产物已经生成，后续不受影响），
          #   且 LIEF 的那些依赖都打包在 third-party/ 里由 FetchContent 提供，
          #   不走 find_package 的默认路径。
          # ⚠️ ANDROID_ALLOW_UNDEFINED_SYMBOLS=ON 是这一关的钥匙：
          #   NDK 的 flags.cmake:123 默认加 -Wl,--no-undefined，但 Python
          #   扩展模块天然带未定义符号 —— PyFrame_GetCode /
          #   PyUnicode_AsUTF8AndSize 等等，这些符号由【运行时进程里的
          #   python 可执行文件】提供，不来自任何 .so。所以不能要求
          #   链接期全部解析。
          #   实测(run 43596160717)不加时：
          #       ld.lld: error: undefined symbol: PyFrame_GetCode
          #       referenced by error.cpp.o in libnanobind-static.a
          #   这是官方开关（flags.cmake:122 的
          #   if(NOT ANDROID_ALLOW_UNDEFINED_SYMBOLS)），比手拼
          #   -Wl,--allow-shlib-undefined 干净且不会与 NDK 默认值打架。
          #
          # ⚠️⚠️ 但只"允许未定义"还不够（run 43598610608 成功产物实测）：
          #   DT_NEEDED 里只有 libm/libdl/libc，没有 libpython3.14.so。
          #   真机 import 时报：
          #       ImportError: dlopen failed: cannot locate symbol
          #       "_Py_FalseStruct" referenced by lief...so
          #   根因：Termux 的 python3.14 是【动态链接 libpython3.14.so】的
          #   （可执行文件本身只导出 6 个符号，2162 个符号都在 .so 里）。
          #   Android 的 dlopen 不会把 libpython 的符号暴露给扩展模块，
          #   所以模块必须自己声明依赖它。
          #   解法：链接时把 Termux 的 libpython3.14.so 加进来，
          #   让产物带 DT_NEEDED=libpython3.14.so。该 .so 随仓库
          #   vendor 提供（lief/vendor/libpython3.14.so，5.7MB）。
          LIBPY_DIR="$GITHUB_WORKSPACE/lief/vendor"
          test -f "$LIBPY_DIR/libpython3.14.so" \
            || { echo "✗ 缺 lief/vendor/libpython3.14.so" >&2; exit 1; }
          cmake -S . -B build-py -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIEF_PYTHON_API=ON \
            -DLIEF_EXAMPLES=OFF \
            -DLIEF_TESTS=OFF \
            -DLIEF_DOC=OFF \
            -DLIEF_LOGGING=OFF \
            -DLIEF_USE_CCACHE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/lief/android-python-shim.cmake" \
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON \
            -DPython_DIR="$GITHUB_WORKSPACE/lief/python-config" \
            -Dnanobind_DIR="$NB_DIR" \
            -DNB_PYINC="$PYINC" \
            -DNB_PYEXE="$(command -v python3)" \
            -DANDROID_ALLOW_UNDEFINED_SYMBOLS=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-L$LIBPY_DIR -Wl,--no-as-needed -lpython3.14" \
            -DCMAKE_MODULE_LINKER_FLAGS="-L$LIBPY_DIR -Wl,--no-as-needed -lpython3.14"

          cmake --build build-py -j"$(nproc)"

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p out
          # ⚠️ 产物名是 _lief.so（下划线开头），不是 lief.so 也不是
          #    pyLIEF.so —— 实测 run 43597303624 第 12 步：
          #        [912/912] Linking CXX shared module api/python/_lief.so
          #    但 find 只匹配 lief*.so / pyLIEF*.so，两者都不匹配，
          #    导致 out/ 为空、upload-artifact 报 if-no-files-found。
          #    这里改成收集 build-py 下所有 .so，再用 file 确认架构。
          echo "== build-py 下所有 .so =="
          find lief-src/build-py -name "*.so" -type f | while read -r f; do
            printf "  %-60s %s\n" "$f" "$(stat -c%s "$f") 字节"
          done

          # 只取 Python 扩展模块（名字里带 lief / pyLIEF 的）
          find lief-src/build-py -name "*lief*.so" -type f -exec cp {} out/ \;

          echo
          echo "== 收集结果 =="
          ls -la out/
          [ -n "$(ls -A out/)" ] || {
            echo "✗ out/ 是空的，没找到扩展模块" >&2
            find lief-src/build-py -name "*.so" | head -20 >&2
            exit 1
          }

          echo
          echo "== 架构确认（必须是 AArch64）=="
          for f in out/*.so; do
            file "$f"
            file "$f" | grep -qi "aarch64\|ARM aarch64" \
              || { echo "✗ $f 不是 AArch64 产物" >&2; exit 1; }
          done

          echo
          echo "== 依赖检查（必须有 libpython3.14.so）=="
          for f in out/*.so; do
            echo "--- $(basename "$f")"
            readelf -d "$f" | grep -E "NEEDED" | sed 's/^/    /'
            # 硬校验：必须有 DT_NEEDED=libpython3.14.so。
            # 没有的话真机 import 会报 cannot locate symbol "_Py_FalseStruct"
            # （Termux 的 python3.14 是动态链 libpython 的，符号都在那里，
            #  Android 的 dlopen 不会自动暴露给扩展模块）。
            readelf -d "$f" | grep -q "libpython3.14.so" \
              || { echo "✗ $f 缺 DT_NEEDED=libpython3.14.so，真机会 ImportError" >&2; exit 1; }
            echo "    ✓ 有 libpython3.14.so 依赖"
          done

          # ── 打包成可直接用的 Python 包 ──────────────────────────
          # 只给 .so 不够用：真机 import 时还需要 lief/ 这个 Python 包，
          # 里面的 __init__.py 负责 from . import _lief 再 re-export 符号。
          # 缺了它只能 import _lief（私有模块名），拿不到 lief.ELF 等 API。
          # 实测：只放 .so 时 `import lief` 会报
          #     ImportError: dynamic module does not define module
          #     export function (PyInit_lief)   ← 因为 init 名是 PyInit__lief
          echo
          echo "== 打包 lief 目录 =="
          # 源码里的 lief/ 是纯 Python（无编译产物），直接拷
          test -d lief-src/api/python/lief || { echo "✗ 缺 api/python/lief/" >&2; exit 1; }
          cp -a lief-src/api/python/lief "$GITHUB_WORKSPACE/stage-lief"
          # 把编好的扩展模块按 Python 的命名约定放进去：
          #   模块 init 函数是 PyInit__lief → 文件名必须是 _lief.<abi>.so
          SO=$(ls out/*lief*.so | head -1)
          ABI="cpython-$(echo "$PYTHON_VERSION" | tr -d '.' )-aarch64-linux-android"
          cp "$SO" "$GITHUB_WORKSPACE/stage-lief/_lief.${ABI}.so"
          echo "  扩展模块 → stage-lief/_lief.${ABI}.so"
          # 检查包结构完整
          test -f "$GITHUB_WORKSPACE/stage-lief/__init__.py" || { echo "✗ 缺 __init__.py" >&2; exit 1; }
          find "$GITHUB_WORKSPACE/stage-lief" -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$GITHUB_WORKSPACE/stage-lief" -type f | wc -l | xargs echo "  包内文件数:"

          # 打包成 tar.gz（保留目录结构，解压即用）
          tar czf out/lief-py${PYTHON_VERSION}-android-arm64.tar.gz \
              -C "$GITHUB_WORKSPACE" stage-lief --transform 's,^stage-lief,lief,'
          ls -lh out/lief-py*.tar.gz

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lief-android-arm64-py${{ env.PYTHON_VERSION }}
          path: out/
          if-no-files-found: error
